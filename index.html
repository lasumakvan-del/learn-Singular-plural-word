<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>એકવચન-બહુવચન - Singular Plural</title>
    
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
    
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        #root {
            width: 100%;
            min-height: 100vh;
        }
        
        @keyframes glow {
            0%, 100% {
                text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #4fc3f7, 0 0 40px #4fc3f7;
            }
            50% {
                text-shadow: 0 0 20px #fff, 0 0 30px #81d4fa, 0 0 40px #81d4fa, 0 0 50px #81d4fa, 0 0 60px #4fc3f7;
            }
        }
        
        .glow {
            animation: glow 2s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function SingularPluralApp() {
          const [currentSlide, setCurrentSlide] = useState(0);
          const [currentAppSlide, setCurrentAppSlide] = useState(0);
          const [currentQuestion, setCurrentQuestion] = useState(0);
          const [selectedOption, setSelectedOption] = useState(null);
          const [score, setScore] = useState(0);
          const [showFeedback, setShowFeedback] = useState(false);
          const [answered, setAnswered] = useState(false);
          const [filteredQuestions, setFilteredQuestions] = useState([]);
          const [windowSize, setWindowSize] = useState({
            width: window.innerWidth,
            height: window.innerHeight
          });

          useEffect(() => {
            function handleResize() {
              setWindowSize({
                width: window.innerWidth,
                height: window.innerHeight
              });
            }

            window.addEventListener('resize', handleResize);
            return () => window.removeEventListener('resize', handleResize);
          }, []);

          const isMobile = windowSize.width < 768;
          const isTablet = windowSize.width >= 768 && windowSize.width < 1024;
          const isLandscape = windowSize.width > windowSize.height;

          const rulesSlides = [
            {
              id: 1,
              title: '-s ઉમેરવાનો નિયમ',
              simpleRule: 'બહુતાંશ શબ્દોમાં ફક્ત -s ઉમેરો',
              explanation: 'જે શબ્દો સામાન્ય અક્ષરથી સમાપ્ત થાય છે, તેમનું બહુવચન બનાવવા માટે ફક્ત -s ઉમેરો.',
              color: '#FF5722',
              examples: [
                { emoji: '🐱', singular: 'cat', plural: 'cats' },
                { emoji: '🐶', singular: 'dog', plural: 'dogs' },
                { emoji: '📚', singular: 'book', plural: 'books' },
                { emoji: '🏠', singular: 'house', plural: 'houses' },
                { emoji: '✏️', singular: 'pencil', plural: 'pencils' }
              ]
            },
            {
              id: 2,
              title: '-es ઉમેરવાનો નિયમ',
              simpleRule: 's, sh, ch, x, z અને o સાથે સમાપ્ત થતા શબ્દોમાં -es ઉમેરો',
              explanation: 'જે શબ્દો s, sh, ch, x, z અથવા o અક્ષરોથી સમાપ્ત થાય છે, તેમનું બહુવચન બનાવવા માટે -es ઉમેરો.',
              color: '#4CAF50',
              examples: [
                { emoji: '🚌', singular: 'bus', plural: 'buses' },
                { emoji: '🍽️', singular: 'dish', plural: 'dishes' },
                { emoji: '⛪', singular: 'church', plural: 'churches' },
                { emoji: '📦', singular: 'box', plural: 'boxes' },
                { emoji: '🥔', singular: 'potato', plural: 'potatoes' }
              ]
            },
            {
              id: 3,
              title: 'y ને ies માં બદલવાનો નિયમ',
              simpleRule: 'વ્યંજન + y સાથે સમાપ્ત થતા શબ્દોમાં y ને ies માં બદલો',
              explanation: 'જે શબ્દો વ્યંજન અક્ષર + y સાથે સમાપ્ત થાય છે, તેમનું બહુવચન બનાવવા માટે y ને ies માં બદલો.',
              color: '#2196F3',
              examples: [
                { emoji: '👶', singular: 'baby', plural: 'babies' },
                { emoji: '🎈', singular: 'party', plural: 'parties' },
                { emoji: '🏙️', singular: 'city', plural: 'cities' },
                { emoji: '🍓', singular: 'berry', plural: 'berries' },
                { emoji: '🪰', singular: 'fly', plural: 'flies' }
              ],
              trick: 'યાદ રાખો: જો y પહેલાં સ્વર (a, e, i, o, u) હોય તો ફક્ત -s ઉમેરો: boy → boys, key → keys'
            },
            {
              id: 4,
              title: 'f/fe ને ves માં બદલવાનો નિયમ',
              simpleRule: 'f અથવા fe સાથે સમાપ્ત થતા શબ્દોમાં f/fe ને ves માં બદલો',
              explanation: 'જે શબ્દો f અથવા fe થી સમાપ્ત થાય છે, તેમનું બહુવચન બનાવવા માટે f અથવા fe ને ves માં બદલો.',
              color: '#9C27B0',
              examples: [
                { emoji: '🔪', singular: 'knife', plural: 'knives' },
                { emoji: '🐺', singular: 'wolf', plural: 'wolves' },
                { emoji: '📚', singular: 'shelf', plural: 'shelves' },
                { emoji: '🍃', singular: 'leaf', plural: 'leaves' },
                { emoji: '👨‍👩‍👧', singular: 'wife', plural: 'wives' }
              ]
            },
            {
              id: 5,
              title: 'અનિયમિત બહુવચન',
              simpleRule: 'કેટલાક શબ્દો કોઈ નિયમનું પાલન કરતા નથી - તેમને યાદ રાખવા પડે',
              explanation: 'આ શબ્દો અનિયમિત છે અને કોઈ ચોક્કસ નિયમનું પાલન કરતા નથી. તેમને યાદ રાખવા પડે છે.',
              color: '#FF9800',
              examples: [
                { emoji: '👨', singular: 'man', plural: 'men' },
                { emoji: '👩', singular: 'woman', plural: 'women' },
                { emoji: '🦷', singular: 'tooth', plural: 'teeth' },
                { emoji: '🦶', singular: 'foot', plural: 'feet' },
                { emoji: '🐁', singular: 'mouse', plural: 'mice' },
                { emoji: '🧒', singular: 'child', plural: 'children' }
              ],
              trick: 'કેટલાક શબ્દો એકવચન અને બહુવચનમાં સરખા જ રહે છે: sheep, fish, deer'
            }
          ];

          const allQuestions = [
            { type: 'sentence', sentence: 'I have two pet _____.', word: 'cat', options: ['cats', 'cat', 'cates', 'caties'], correct: 'cats' },
            { type: 'sentence', sentence: 'She bought a beautiful _____.', word: 'dress', options: ['dress', 'dresses', 'dresss', 'dresis'], correct: 'dress' },
            { type: 'sentence', sentence: 'The _____ are playing in the park.', word: 'child', options: ['children', 'child', 'childs', 'childes'], correct: 'children' },
            { type: 'sentence', sentence: 'He told me a funny _____.', word: 'story', options: ['story', 'stories', 'storys', 'storie'], correct: 'story' },
            { type: 'sentence', sentence: 'Many _____ are flying in the sky.', word: 'bird', options: ['birds', 'bird', 'birdes', 'birdies'], correct: 'birds' },
            { type: 'sentence', sentence: 'There is a _____ on the table.', word: 'knife', options: ['knife', 'knives', 'knifes', 'knive'], correct: 'knife' },
            { type: 'sentence', sentence: 'All the _____ have fallen from the tree.', word: 'leaf', options: ['leaves', 'leaf', 'leafs', 'leafes'], correct: 'leaves' },
            { type: 'sentence', sentence: 'I need a new _____.', word: 'watch', options: ['watch', 'watches', 'watchs', 'watche'], correct: 'watch' },
            { type: 'sentence', sentence: 'I saw three _____ on the road.', word: 'bus', options: ['buses', 'bus', 'buss', 'busies'], correct: 'buses' },
            { type: 'sentence', sentence: 'A _____ is sleeping in the garden.', word: 'baby', options: ['baby', 'babies', 'babys', 'babie'], correct: 'baby' },
            { type: 'sentence', sentence: 'The dentist checked my _____.', word: 'tooth', options: ['teeth', 'tooth', 'tooths', 'toothes'], correct: 'teeth' },
            { type: 'sentence', sentence: 'This _____ is very interesting.', word: 'book', options: ['book', 'books', 'bookes', 'booke'], correct: 'book' },
            { type: 'sentence', sentence: 'We visited two _____ yesterday.', word: 'city', options: ['cities', 'city', 'citys', 'cityies'], correct: 'cities' },
            { type: 'sentence', sentence: 'A _____ is standing near the tree.', word: 'man', options: ['man', 'men', 'mans', 'manes'], correct: 'man' },
            { type: 'sentence', sentence: 'The _____ are singing beautifully.', word: 'lady', options: ['ladies', 'lady', 'ladys', 'ladyies'], correct: 'ladies' },
            { type: 'sentence', sentence: 'We need a _____ for cooking.', word: 'potato', options: ['potato', 'potatoes', 'potatos', 'potatoe'], correct: 'potato' },
            { type: 'sentence', sentence: 'Many _____ live in this forest.', word: 'wolf', options: ['wolves', 'wolf', 'wolfs', 'wolfes'], correct: 'wolves' },
            { type: 'sentence', sentence: 'My mother is a kind _____.', word: 'woman', options: ['woman', 'women', 'womans', 'womanes'], correct: 'woman' },
            { type: 'sentence', sentence: 'She has three pet _____.', word: 'mouse', options: ['mice', 'mouse', 'mouses', 'mices'], correct: 'mice' },
            { type: 'sentence', sentence: 'I have a pet _____.', word: 'cat', options: ['dog', 'dogs', 'doges', 'dogies'], correct: 'dog' },
            { type: 'word', sentence: 'a dog → _____', options: ['dogs', 'doges', 'dogies', 'dog'], correct: 'dogs' },
            { type: 'word', sentence: 'cats → _____', options: ['a cat', 'cate', 'caty', 'cats'], correct: 'a cat' },
            { type: 'word', sentence: 'a box → _____', options: ['boxes', 'boxs', 'boxies', 'box'], correct: 'boxes' },
            { type: 'word', sentence: 'children → _____', options: ['a child', 'childs', 'childen', 'children'], correct: 'a child' },
            { type: 'word', sentence: 'a city → _____', options: ['cities', 'citys', 'cityies', 'city'], correct: 'cities' },
            { type: 'word', sentence: 'babies → _____', options: ['a baby', 'babie', 'babys', 'babies'], correct: 'a baby' },
            { type: 'word', sentence: 'a man → _____', options: ['men', 'mans', 'manes', 'man'], correct: 'men' },
            { type: 'word', sentence: 'dishes → _____', options: ['a dish', 'dishe', 'dishs', 'dishes'], correct: 'a dish' },
            { type: 'word', sentence: 'a watch → _____', options: ['watches', 'watchs', 'watchies', 'watch'], correct: 'watches' },
            { type: 'word', sentence: 'knives → _____', options: ['a knife', 'knive', 'knif', 'knives'], correct: 'a knife' },
            { type: 'word', sentence: 'a leaf → _____', options: ['leaves', 'leafs', 'leafes', 'leaf'], correct: 'leaves' },
            { type: 'word', sentence: 'feet → _____', options: ['a foot', 'feet', 'feets', 'foots'], correct: 'a foot' },
            { type: 'word', sentence: 'a tooth → _____', options: ['teeth', 'tooths', 'toothes', 'tooth'], correct: 'teeth' },
            { type: 'word', sentence: 'mice → _____', options: ['a mouse', 'mice', 'mices', 'mous'], correct: 'a mouse' },
            { type: 'word', sentence: 'a story → _____', options: ['stories', 'storys', 'storyies', 'story'], correct: 'stories' },
            { type: 'word', sentence: 'women → _____', options: ['a woman', 'women', 'womans', 'weman'], correct: 'a woman' },
            { type: 'word', sentence: 'a wolf → _____', options: ['wolves', 'wolfs', 'wolfes', 'wolf'], correct: 'wolves' },
            { type: 'word', sentence: 'shelves → _____', options: ['a shelf', 'shelve', 'shalf', 'shelves'], correct: 'a shelf' },
            { type: 'word', sentence: 'a hero → _____', options: ['heroes', 'heros', 'heroies', 'hero'], correct: 'heroes' },
            { type: 'word', sentence: 'countries → _____', options: ['a country', 'countrie', 'countrys', 'countries'], correct: 'a country' },
            { type: 'word', sentence: 'a glass → _____', options: ['glasses', 'glasss', 'glasies', 'glass'], correct: 'glasses' },
            { type: 'word', sentence: 'books → _____', options: ['a book', 'booke', 'books', 'bookes'], correct: 'a book' },
            { type: 'word', sentence: 'a bench → _____', options: ['benches', 'benchs', 'benchies', 'bench'], correct: 'benches' },
            { type: 'word', sentence: 'foxes → _____', options: ['a fox', 'foxe', 'foxs', 'foxes'], correct: 'a fox' },
            { type: 'word', sentence: 'a wife → _____', options: ['wives', 'wifes', 'wifees', 'wife'], correct: 'wives' },
            { type: 'word', sentence: 'parties → _____', options: ['a party', 'partie', 'partys', 'parties'], correct: 'a party' },
            { type: 'word', sentence: 'a berry → _____', options: ['berries', 'berrys', 'berryies', 'berry'], correct: 'berries' },
            { type: 'word', sentence: 'lives → _____', options: ['a life', 'live', 'lif', 'lives'], correct: 'a life' },
            { type: 'word', sentence: 'a photo → _____', options: ['photos', 'photoes', 'photoies', 'photo'], correct: 'photos' },
            { type: 'word', sentence: 'teeth → _____', options: ['a tooth', 'teeth', 'tooths', 'teeths'], correct: 'a tooth' }
          ];

          function handleSlideChange(direction) {
            if (direction === 'next' && currentSlide < rulesSlides.length - 1) {
              setCurrentSlide(currentSlide + 1);
            } else if (direction === 'prev' && currentSlide > 0) {
              setCurrentSlide(currentSlide - 1);
            }
          }

          function handleDotClick(index) {
            setCurrentSlide(index);
          }

          function startQuiz() {
            setCurrentAppSlide(1);
          }

          function selectQuizType(type) {
            let questions = allQuestions;
            if (type === 'sentence') {
              questions = allQuestions.filter(q => q.type === 'sentence');
            } else if (type === 'word') {
              questions = allQuestions.filter(q => q.type === 'word');
            }
            setFilteredQuestions(questions);
            setCurrentQuestion(0);
            setScore(0);
            setSelectedOption(null);
            setShowFeedback(false);
            setAnswered(false);
            setCurrentAppSlide(2);
          }

          function backToRules() {
            setCurrentAppSlide(0);
            setCurrentQuestion(0);
            setScore(0);
          }

          function backToQuizSelection() {
            setCurrentAppSlide(1);
            setCurrentQuestion(0);
            setScore(0);
            setSelectedOption(null);
            setShowFeedback(false);
            setAnswered(false);
          }

          function handleOptionSelect(option) {
            if (answered) return;
            setSelectedOption(option);
          }

          function handleSubmit() {
            if (selectedOption === null || answered) return;
            
            const isCorrect = selectedOption === filteredQuestions[currentQuestion].correct;
            if (isCorrect) {
              setScore(score + 1);
            }
            setShowFeedback(true);
            setAnswered(true);
          }

          function handleNext() {
            if (currentQuestion < filteredQuestions.length - 1) {
              setCurrentQuestion(currentQuestion + 1);
              setSelectedOption(null);
              setShowFeedback(false);
              setAnswered(false);
            } else {
              const finalScore = score + (selectedOption === filteredQuestions[currentQuestion].correct ? 1 : 0);
              alert(`ક્વિઝ પૂર્ણ થઈ! તમારો સ્કોર: ${finalScore}/${filteredQuestions.length}`);
              backToQuizSelection();
            }
          }

          const currentRuleSlide = rulesSlides[currentSlide];
          const currentQuiz = filteredQuestions[currentQuestion];

          return (
            <div style={{
              background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
              minHeight: '100vh',
              maxHeight: '100vh',
              padding: isMobile ? '5px' : '8px',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'center',
              overflow: 'hidden'
            }}>
              <div style={{ 
                maxWidth: isMobile ? '95%' : isTablet ? '85%' : '700px',
                width: '100%',
                maxHeight: '98vh',
                display: 'flex',
                flexDirection: 'column'
              }}>
                {currentAppSlide === 0 && (
                  <div style={{
                    background: 'white',
                    borderRadius: '15px',
                    boxShadow: '0 8px 20px rgba(0,0,0,0.2)',
                    overflow: 'hidden',
                    display: 'flex',
                    flexDirection: 'column',
                    maxHeight: '98vh'
                  }}>
                    <div style={{
                      background: 'linear-gradient(135deg, #1976D2 0%, #2196F3 50%, #42A5F5 100%)',
                      color: 'white',
                      padding: '10px',
                      textAlign: 'center'
                    }}>
                      <div className="glow" style={{ fontSize: '13px', fontWeight: '600', marginBottom: '3px', textTransform: 'uppercase' }}>
                        ✨ Makvana Sanjaysir ✨
                      </div>
                      <div style={{ fontSize: '12px', marginBottom: '4px' }}>
                        Piparadi-2 Primary School
                      </div>
                      <h2 style={{ fontSize: '19px', margin: 0 }}>એકવચન-બહુવચન નિયમો</h2>
                      <p style={{ fontSize: '12px', margin: '3px 0 0 0' }}>Singular-Plural Rules</p>
                    </div>

                    <div style={{ padding: '10px', flex: 1, overflowY: 'auto' }}>
                      <div style={{
                        background: '#f8f9fa',
                        borderRadius: '12px',
                        padding: '15px',
                        borderLeft: `4px solid ${currentRuleSlide.color}`
                      }}>
                        <div style={{
                          fontSize: '19px',
                          fontWeight: 'bold',
                          textAlign: 'center',
                          marginBottom: '10px',
                          padding: '8px',
                          borderRadius: '8px',
                          color: 'white',
                          background: currentRuleSlide.color
                        }}>
                          {currentRuleSlide.title}
                        </div>

                        <div style={{ fontSize: '16px', textAlign: 'center', marginBottom: '10px', fontWeight: 'bold', color: '#333' }}>
                          {currentRuleSlide.simpleRule}
                        </div>

                        <div style={{ background: '#e3f2fd', padding: '10px', borderRadius: '8px', marginBottom: '10px', fontSize: '14px' }}>
                          <strong>સરળ નિયમ:</strong> {currentRuleSlide.explanation}
                        </div>

                        <div style={{ background: '#f1f8e9', padding: '10px', borderRadius: '8px' }}>
                          {currentRuleSlide.examples.map((ex, idx) => (
                            <div key={idx} style={{ display: 'flex', alignItems: 'center', margin: '6px 0', padding: '4px', fontSize: '14px' }}>
                              <span style={{ fontSize: '18px', marginRight: '8px', width: '25px' }}>{ex.emoji}</span>
                              <span style={{ flex: 1 }}>
                                <span style={{ fontWeight: 'bold', color: '#2196F3' }}>{ex.singular}</span>
                                {' → '}
                                <span style={{ fontWeight: 'bold', color: '#4CAF50' }}>{ex.plural}</span>
                              </span>
                            </div>
                          ))}
                        </div>

                        {currentRuleSlide.trick && (
                          <div style={{ background: '#fff3e0', padding: '10px', borderRadius: '8px', marginTop: '8px', borderLeft: '3px solid #FF9800', fontSize: '13px' }}>
                            <div style={{ fontWeight: 'bold', marginBottom: '4px', color: '#E65100' }}>💡 યાદ રાખો:</div>
                            {currentRuleSlide.trick}
                          </div>
                        )}
                      </div>

                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '10px', gap: '8px' }}>
                        <button
                          onClick={() => handleSlideChange('prev')}
                          disabled={currentSlide === 0}
                          style={{
                            padding: '8px 15px',
                            fontSize: '14px',
                            background: currentSlide === 0 ? '#ccc' : '#2196F3',
                            color: 'white',
                            border: 'none',
                            borderRadius: '6px',
                            cursor: currentSlide === 0 ? 'not-allowed' : 'pointer',
                            fontWeight: 'bold'
                          }}
                        >
                          ← પાછળ
                        </button>

                        <div style={{ display: 'flex', gap: '6px' }}>
                          {rulesSlides.map((_, idx) => (
                            <div
                              key={idx}
                              onClick={() => handleDotClick(idx)}
                              style={{
                                width: '9px',
                                height: '9px',
                                borderRadius: '50%',
                                background: currentSlide === idx ? '#2196F3' : '#ccc',
                                cursor: 'pointer'
                              }}
                            />
                          ))}
                        </div>

                        <button
                          onClick={() => handleSlideChange('next')}
                          disabled={currentSlide === rulesSlides.length - 1}
                          style={{
                            padding: '8px 15px',
                            fontSize: '14px',
                            background: currentSlide === rulesSlides.length - 1 ? '#ccc' : '#2196F3',
                            color: 'white',
                            border: 'none',
                            borderRadius: '6px',
                            cursor: currentSlide === rulesSlides.length - 1 ? 'not-allowed' : 'pointer',
                            fontWeight: 'bold'
                          }}
                        >
                          આગળ →
                        </button>
                      </div>

                      <button
                        onClick={startQuiz}
                        style={{
                          width: '100%',
                          marginTop: '10px',
                          padding: '12px',
                          fontSize: '16px',
                          background: 'linear-gradient(135deg, #FF6B6B 0%, #FFE66D 100%)',
                          color: 'white',
                          border: 'none',
                          borderRadius: '8px',
                          cursor: 'pointer',
                          fontWeight: 'bold'
                        }}
                      >
                        🎯 હવે ક્વિઝ રમો!
                      </button>
                    </div>
                  </div>
                )}

                {currentAppSlide === 1 && (
                  <div style={{ background: 'white', borderRadius: '15px', boxShadow: '0 8px 20px rgba(0,0,0,0.2)', padding: '20px', textAlign: 'center' }}>
                    <div style={{ background: 'linear-gradient(135deg, #1976D2 0%, #2196F3 50%, #42A5F5 100%)', color: 'white', padding: '10px', borderRadius: '8px', marginBottom: '15px' }}>
                      <div className="glow" style={{ fontSize: '13px', fontWeight: '600', marginBottom: '3px', textTransform: 'uppercase' }}>
                        ✨ Makvana Sanjaysir ✨
                      </div>
                      <div style={{ fontSize: '12px' }}>Piparadi-2 Primary School</div>
                    </div>

                    <h2 style={{ fontSize: '20px', marginBottom: '15px', color: '#2196F3' }}>ક્વિઝ પ્રકાર પસંદ કરો</h2>

                    <div style={{ display: 'flex', flexDirection: 'column', gap: '12px', marginBottom: '15px' }}>
                      <button onClick={() => selectQuizType('all')} style={{ padding: '15px', fontSize: '16px', background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)', color: 'white', border: 'none', borderRadius: '8px', cursor: 'pointer', fontWeight: 'bold' }}>
                        📝 બધા પ્રશ્નો
                      </button>
                      <button onClick={() => selectQuizType('sentence')} style={{ padding: '15px', fontSize: '16px', background: 'linear-gradient(135deg, #4CAF50 0%, #8BC34A 100%)', color: 'white', border: 'none', borderRadius: '8px', cursor: 'pointer', fontWeight: 'bold' }}>
                        ✍️ વાક્ય પૂર્ણ કરો
                      </button>
                      <button onClick={() => selectQuizType('word')} style={{ padding: '15px', fontSize: '16px', background: 'linear-gradient(135deg, #FF9800 0%, #FF5722 100%)', color: 'white', border: 'none', borderRadius: '8px', cursor: 'pointer', fontWeight: 'bold' }}>
                        🔤 શબ્દ બદલો
                      </button>
                    </div>

                    <button onClick={backToRules} style={{ padding: '10px 20px', fontSize: '14px', background: '#ccc', color: '#333', border: 'none', borderRadius: '6px', cursor: 'pointer', fontWeight: 'bold' }}>
                      ← નિયમો પર પાછા જાઓ
                    </button>
                  </div>
                )}

                {currentAppSlide === 2 && currentQuiz && (
                  <div style={{ background: 'white', borderRadius: '15px', boxShadow: '0 8px 20px rgba(0,0,0,0.2)', padding: '18px', maxHeight: '98vh', overflow: 'auto' }}>
                    <div style={{ background: 'linear-gradient(135deg, #1976D2 0%, #2196F3 50%, #42A5F5 100%)', color: 'white', padding: '6px', borderRadius: '6px', marginBottom: '10px', textAlign: 'center' }}>
                      <div className="glow" style={{ fontSize: '10px', fontWeight: '600' }}>
                        ✨ Makvana Sanjaysir - Piparadi-2 Primary School ✨
                      </div>
                    </div>

                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '12px', fontSize: '14px' }}>
                      <span>પ્રશ્ન {currentQuestion + 1}/{filteredQuestions.length}</span>
                      <span style={{ fontWeight: 'bold', color: '#4CAF50' }}>સ્કોર: {score}</span>
                    </div>

                    <div style={{ background: '#f8f9fa', padding: '18px', borderRadius: '10px', marginBottom: '12px', textAlign: 'center' }}>
                      <div style={{ fontSize: '18px', fontWeight: 'bold', color: '#2196F3' }}>
                        {currentQuiz.sentence}
                      </div>
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : '1fr 1fr', gap: '10px', marginBottom: '12px' }}>
                      {currentQuiz.options.map((option, idx) => (
                        <button
                          key={idx}
                          onClick={() => handleOptionSelect(option)}
                          disabled={answered}
                          style={{
                            padding: '14px',
                            fontSize: '16px',
                            background: selectedOption === option 
                              ? (answered ? (option === currentQuiz.correct ? '#4CAF50' : '#F44336') : '#2196F3')
                              : (answered && option === currentQuiz.correct ? '#4CAF50' : 'white'),
                            color: selectedOption === option || (answered && option === currentQuiz.correct) ? 'white' : '#333',
                            border: selectedOption === option ? 'none' : '2px solid #ddd',
                            borderRadius: '8px',
                            cursor: answered ? 'not-allowed' : 'pointer',
                            fontWeight: 'bold'
                          }}
                        >
                          {option}
                        </button>
                      ))}
                    </div>

                    {showFeedback && (
                      <div style={{
                        padding: '12px',
                        borderRadius: '8px',
                        marginBottom: '12px',
                        background: selectedOption === currentQuiz.correct ? '#E8F5E9' : '#FFEBEE',
                        color: selectedOption === currentQuiz.correct ? '#2E7D32' : '#C62828',
                        textAlign: 'center',
                        fontSize: '16px',
                        fontWeight: 'bold'
                      }}>
                        {selectedOption === currentQuiz.correct ? '✅ સાચું!' : '❌ ખોટું! સાચો જવાબ: ' + currentQuiz.correct}
                      </div>
                    )}

                    <div style={{ display: 'flex', gap: '8px', justifyContent: 'space-between' }}>
                      <button onClick={backToQuizSelection} style={{ padding: '10px 15px', fontSize: '14px', background: '#ccc', color: '#333', border: 'none', borderRadius: '6px', cursor: 'pointer', fontWeight: 'bold' }}>
                        ← પાછા જાઓ
                      </button>

                      {!answered ? (
                        <button onClick={handleSubmit} disabled={selectedOption === null} style={{ padding: '10px 18px', fontSize: '14px', background: selectedOption === null ? '#ccc' : '#4CAF50', color: 'white', border: 'none', borderRadius: '6px', cursor: selectedOption === null ? 'not-allowed' : 'pointer', fontWeight: 'bold', flex: 1 }}>
                          જવાબ તપાસો
                        </button>
                      ) : (
                        <button onClick={handleNext} style={{ padding: '10px 18px', fontSize: '14px', background: '#2196F3', color: 'white', border: 'none', borderRadius: '6px', cursor: 'pointer', fontWeight: 'bold', flex: 1 }}>
                          {currentQuestion < filteredQuestions.length - 1 ? 'આગળ →' : 'પૂર્ણ કરો'}
                        </button>
                      )}
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SingularPluralApp />);
    </script>
</body>
</html>
